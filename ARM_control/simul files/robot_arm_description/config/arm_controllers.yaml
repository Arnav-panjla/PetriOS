controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0

      joint_1:
        trajectory: 0.05
        goal: 0.02
      joint_2:
        trajectory: 0.05
        goal: 0.02
      joint_3:
        trajectory: 0.05
        goal: 0.02
      joint_4:
        trajectory: 0.05
        goal: 0.02
      joint_5:
        trajectory: 0.05
        goal: 0.02

gripper_controller:
  ros__parameters:
    joints:
      - left_finger_joint
      - right_finger_joint
      - left_gripper_link_joint
      - right_gripper_link_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0

      left_finger_joint:
        trajectory: 0.05
        goal: 0.02

      right_finger_joint:
        trajectory: 0.05
        goal: 0.02

      left_gripper_link_joint:
        trajectory: 0.05
        goal: 0.02

      right_gripper_link_joint:
        trajectory: 0.05
        goal: 0.02