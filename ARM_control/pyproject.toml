[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-arm"
version = "0.1.0"
description = "Open-loop six-servo arm control for a PCA9685 on a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML"]

[project.optional-dependencies]
hardware = ["adafruit-circuitpython-servokit"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
