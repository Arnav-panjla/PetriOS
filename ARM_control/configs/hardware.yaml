# PCA9685 on the Raspberry Pi I2C header. Servo motor current is not drawn from the Pi.
#
# PCA9685 pin     Raspberry Pi 40-pin header
# GND             Pin 6    GND
# VCC             Pin 1    3.3 V     chip and I2C logic only
# SDA             Pin 3    GPIO 2    I2C1 SDA   (/dev/i2c-1)
# SCL             Pin 5    GPIO 3    I2C1 SCL   (/dev/i2c-1)
# V+              external 5-6 V servo supply (+)
# GND             that supply's negative, tied to the same Pi GND
#
# Servo plug on the header marked with the channel:
#   brown or black -> GND
#   red            -> V+
#   orange, yellow, or white -> PWM
# Joints use channels 10, 11, 12, 13, 14, 15.
# Address pads A0-A5 left open. OE left unconnected.
# Do not power the servos from Pi pin 2 or pin 4.

i2c_bus: 1
address: 0x40
pwm_frequency_hz: 50
startup:
  require_confirmation: true
