# Servo and frame corrections. These are not URDF dimensions.
# direction +1 means increasing servo degrees increases the URDF angle.
# zero_offset_deg is the servo angle that corresponds to URDF q = 0.
# The values below start as an identity map. They are not measured.
units:
  angle: deg
  length: mm
servos:
  - index: 0
    role: azimuth
    urdf_joint: joint_1
    direction: 1
    zero_offset_deg: 0.0
  - index: 1
    role: shoulder
    urdf_joint: joint_2
    direction: 1
    zero_offset_deg: 0.0
  - index: 2
    role: elbow
    urdf_joint: joint_3
    direction: 1
    zero_offset_deg: 0.0
  - index: 3
    role: wrist_pitch
    urdf_joint: joint_4
    direction: 1
    zero_offset_deg: 0.0
  - index: 4
    role: wrist_roll
    urdf_joint: joint_5
    direction: 1
    zero_offset_deg: 0.0
  - index: 5
    role: gripper
    urdf_joint: ""
    direction: 1
    zero_offset_deg: 0.0
coordinate:
  theta_zero_offset_deg: 0.0
  theta_direction: 1
  r_offset_mm: 0.0
  z_offset_mm: 0.0
  tool_pitch_offset_deg: 0.0
  position_correction_mm: [0.0, 0.0, 0.0]
ik_check:
  position_mm: 2.0
  pitch_deg: 2.0
